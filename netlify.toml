# Déploiement Netlify de la version 2.
#
# Le plugin Next.js de Netlify est détecté automatiquement. Les routes de
# l'API (formulaire de contact, projection du globe) tournent en fonctions
# serverless : voir docs/version2/DEPLOY.md pour les variables à renseigner.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
